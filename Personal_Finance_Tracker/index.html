<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Finance Tracker</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <h1>Personal Finance Tracker</h1>

        <!-- Form to add transactions -->
        <form id="expenseForm">
            <div class="form-group">
                <label for="amount">Amount:</label>
                <input type="number" id="amount" required placeholder="Amount" step="0.01">
            </div>
            <div class="form-group">
                <label for="category">Category:</label>
                <select id="category">
                    <option value="Food">Food</option>
                    <option value="Rent">Rent</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Savings">Savings</option>
                </select>
            </div>
            <div class="form-group">
                <label for="date">Date:</label>
                <input type="date" id="date" required>
            </div>
            <button type="submit">Add Transaction</button>
        </form>

        <!-- Display Total Expenses and Savings -->
        <div id="totals">
            <h2>Total Expenses: $<span id="totalExpenses">0.00</span></h2>
            <h2>Total Savings: $<span id="totalSavings">0.00</span></h2>
        </div>

        <!-- Pie Chart -->
        <div>
            <canvas id="expenseChart" width="400" height="400"></canvas>
        </div>

        <div>
            <h3>Transaction History</h3>
            <ul id="transactionList"></ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
