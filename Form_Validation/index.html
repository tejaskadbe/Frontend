<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Form with Validation</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="form-container">
        <form id="dynamicForm" action="#">
            <h2>User Registration Form</h2>

            <!-- Name -->
            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name" required>

            <!-- Email -->
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <!-- Country -->
            <label for="country">Country:</label>
            <select id="country" name="country" required>
                <option value="">Select a country</option>
                <option value="us">India</option>
                <option value="us">United States</option>
                <option value="ca">Canada</option>
                <option value="other">Other</option>
            </select>

            <!-- Conditional State field (only shown if United States is selected) -->
            <div id="state-container" class="conditional-field" style="display: none;">
                <label for="state">State:</label>
                <select id="state" name="state">
                    <option value="">Select a state</option>
                    <option value="ny">New York</option>
                    <option value="ca">California</option>
                    <option value="tx">Texas</option>
                    <!-- Add more states as needed -->
                </select>
            </div>

            <!-- Terms and Conditions -->
            <label for="terms">
                <input type="checkbox" id="terms" name="terms" required>
                I agree to the terms and conditions
            </label>

            <!-- Submit Button -->
            <button type="submit">Submit</button>
        </form>

        <!-- Error Message -->
        <div id="error-message" class="error-message" style="display: none;">
            <p>Please fill out all required fields correctly.</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
